<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">

<body>
  <main class="shell">
    <h1>Phone capture has retired</h1>
    <p><a href="/deals">Open Deals</a> to record or review a call on a deal.</p>

      <h2 id="savedRecordings">Recordings on this device</h2>
      <p>Use the same browser and partner account you used to save the recordings.</p>
      <p id="recordingStatus" role="status">Looking for saved recordings…</p>
      <ul id="recordingDownloads"></ul>
    </section>
  </main>
