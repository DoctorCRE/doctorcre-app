name: Signed-in staging tests

# Signed-in tests need Access-gated staging before they can run again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-in-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-browsers
        with:
          browsers: chromium
      - run: npm run build
        env:
          DOCTORCRE_SOURCE_COMMIT: ${{ github.sha }}
      - run: npm run artifact:verify
      - name: Deploy staging
        run: npm run release:staging -- --source-sha "$SOURCE_COMMIT"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify staging release identity
        run: node scripts/verify-app-release.mjs https://doctorcre-app-staging.joe-bookout-carr-us.workers.dev/app-release "$SOURCE_COMMIT" staging
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          E2E_STAGING_ACCESS_CLIENT_ID: ${{ secrets.E2E_STAGING_ACCESS_CLIENT_ID }}
          E2E_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_STAGING_ACCESS_CLIENT_SECRET }}
      - name: Run signed-in staging tests
        id: playwright
        run: |
          test -n "$ENGINE_STORAGE_STATE"
          mkdir -p playwright/.auth
          umask 077
          printf '%s' "$ENGINE_STORAGE_STATE" > playwright/.auth/engine.json
          unset ENGINE_STORAGE_STATE
          ./node_modules/.bin/playwright test --project=chromium --retries=1 --reporter=line,html,json \
            deals.spec.ts home.spec.ts tours-planner.spec.ts signed-in.spec.ts
        env:
          ENGINE_STORAGE_STATE: ${{ secrets.E2E_ENGINE_STORAGE_STATE }}
          E2E_ENGINE_STORAGE_STATE: playwright/.auth/engine.json
          E2E_ENGINE_JOBS_CLIENT_ID: ${{ secrets.E2E_ENGINE_JOBS_CLIENT_ID }}
          E2E_ENGINE_JOBS_CLIENT_SECRET: ${{ secrets.E2E_ENGINE_JOBS_CLIENT_SECRET }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e/playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: .e2e/staging-results.json
      - name: Summarize results and flaky tests
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' && hashFiles('.e2e/staging-results.json') != '' }}
        run: node scripts/staging-summary.mjs .e2e/staging-results.json >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .e2e/playwright-report
            .e2e/playwright
            .e2e/staging-results.json
          if-no-files-found: warn
          retention-days: 7
