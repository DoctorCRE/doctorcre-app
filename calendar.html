<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Deal deadlines, next steps and meetings by month, week and day">
  <title>Calendar · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to the calendar</a>
  <div data-layout-slot="status">



    <div class="global-controls pref-icons" role="group" aria-label="Presentation">
      <p id="prefsLive" class="sr-only" aria-live="polite"></p>
    </div>
  </div>

  <main id="main" class="shell">
    <p class="sr-only" id="calLive" aria-live="polite" role="status">Updating…</p>

    <section class="cal-board" aria-labelledby="calPeriod">
      <header class="cal-toolbar">
        <h1 id="pageTitle" class="sr-only">Calendar</h1>
        <div class="cal-steps" role="group" aria-label="Move through the calendar">
          <button class="cal-icon" type="button" id="calPrev" aria-label="Previous month"><span aria-hidden="true">‹</span></button>
          <h2 class="cal-period" id="calPeriod" aria-live="polite">Calendar</h2>
          <button class="cal-icon" type="button" id="calNext" aria-label="Next month"><span aria-hidden="true">›</span></button>
        </div>
        <p class="cal-count" id="calCount" aria-live="polite"></p>
        <button class="cal-undated-chip" type="button" id="calUndated" hidden></button>
        <span class="cal-updated" id="calAsOf"></span>
        <button class="cal-icon" type="button" id="calRefresh" aria-label="Refresh Calendar" title="Refresh Calendar"><span aria-hidden="true">↻</span></button>
        <div class="cal-view-switch" id="calViewSwitch" role="group" aria-label="Calendar view">
          <button class="cal-today" type="button" id="calToday">Today</button>
          <div class="cal-segments">
            <button type="button" data-view="day" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><path d="M1.5 6h13M6 9h4v3H6z"/></svg><span>Day</span></button>
            <button type="button" data-view="week" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><path d="M1.5 6h13M5.5 6v8.5M10.5 6v8.5"/></svg><span>Week</span></button>
            <button type="button" data-view="month" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><path d="M1.5 6h13M1.5 10h13M5.5 6v8.5M10.5 6v8.5"/></svg><span>Month</span></button>
          </div>
        </div>
      </header>
      <div class="cal-notices" id="calNotices"></div>
      <div id="calState"><p>Reading Calendar…</p></div>
      <div class="cal-grid" id="calGrid" role="grid" aria-labelledby="calPeriod" data-view="month"></div>
    </section>

    <dialog class="dialog cal-day-sheet" id="dayPanel" aria-labelledby="dayPanelTitle">
      <header>
        <h2 id="dayPanelTitle">Choose a day</h2>
        <button class="cal-icon" type="button" id="dayPanelClose" aria-label="Close day"><span aria-hidden="true">×</span></button>
      </header>
      <div class="cal-day-sheet-body" id="dayPanelBody"></div>
    </dialog>

    <div class="cal-extras">
      <section class="cal-coming" id="calComing" aria-labelledby="agendaTitle" hidden>
        <h3 id="agendaTitle">Coming up</h3>
        <ol class="cal-agenda" id="calAgenda"></ol>
      </section>
    </div>
  </main>

  <div id="receiptDock" class="receipt-dock" role="group" aria-label="Command feedback"></div>
  <footer class="shell"><p class="small">DoctorCRE · Calendar · </p></footer>
  <script type="module" src="/js/calendar.js"></script>
</body>
</html>
