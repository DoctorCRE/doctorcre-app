<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="DoctorCRE settings">
  <title>Settings · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/settings.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to settings</a>

  <main id="main" class="shell settings">
    <h1 class="sr-only">Settings</h1>
    <section class="settings-group" data-section="quiet_hours" id="quietHoursBlock" aria-labelledby="quietHoursTitle">
      <h2 id="quietHoursTitle">Notifications</h2>
      <div class="state-block" id="prefState" data-state="loading">
        <h3 id="prefStateTitle">Reading your preferences…</h3>
        <button class="btn" type="button" id="retryPreference" hidden>Retry</button>
      </div>
      <form class="pref-form" id="prefForm" novalidate hidden>
        <label class="setting-row" for="deviceOptIn">
          <span class="setting-text"><span class="setting-name">Device push</span><span class="setting-hint">Send a device push when something is addressed to me</span></span>
          <input id="deviceOptIn" class="setting-switch" type="checkbox">
        </label>
        <div class="setting-row" role="group" aria-labelledby="quietHoursName">
          <span class="setting-text"><span class="setting-name" id="quietHoursName">Quiet hours</span><span class="setting-hint">Device pushes wait until quiet hours end</span></span>
          <span class="quiet-range">
            <label class="sr-only" for="quietStart">Quiet hours start</label><input id="quietStart" type="text" autocomplete="off" placeholder="Not set">
            <span aria-hidden="true">to</span>
            <label class="sr-only" for="quietEnd">Quiet hours end</label><input id="quietEnd" type="text" autocomplete="off" placeholder="Not set">
          </span>
        </div>
        <div class="pref-act">
          <button class="btn btn-primary" type="submit" id="prefSave">Save preferences</button>
          <button class="btn btn-quiet" type="button" id="prefClear" hidden>Clear quiet hours</button>
          <p class="caption pref-summary" id="prefSummary"></p>
        </div>
      </form>
      <p class="caption pref-message" id="prefMessage" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <div id="phonePush"></div>
    <div id="docLinkSettings"></div>
  </main>

  <div id="receiptDock" class="receipt-dock" role="group" aria-label="Command feedback"></div>
  <script type="module" src="/js/ui-phone-push.generated.js"></script>
  <script type="module" src="/js/notifications.js"></script>
</body>
</html>
