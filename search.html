<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Search · DoctorCRE</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/business-workspace.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to search</a>
  <main id="main" class="shell search-page">
    <h1 data-layout-slot="title">Search</h1>
    <section class="search-toolbar" data-search="ask">
      <form id="searchForm" role="search"><label class="sr-only" for="searchQuery">Name, email or domain</label><input id="searchQuery" type="search" maxlength="200" autocomplete="off" placeholder="Search people, companies and deals"><button class="btn btn-primary" type="submit">Search</button></form>
      <div class="chip-list" id="searchChips" role="group" aria-label="Scope" data-search="scope" hidden></div>
      <span class="small" id="searchCount"></span>
      <div class="chip-list" id="recentSearches" role="group" aria-label="Recent searches" hidden></div>
    </section>
    <p class="sr-only" id="searchLive" aria-live="polite" role="status"></p>
    <div class="search-state" id="searchState" data-state="empty" hidden></div>
    <div id="searchResults" class="search-results" aria-busy="false"></div>
    <section class="search-views" data-search="views" hidden aria-label="Saved views"><span class="small" id="savedViewNote">Saved on this device</span><span class="chip-list" id="savedViewList"></span><label class="sr-only" for="saveViewName">Name for this view</label><input id="saveViewName" type="text" maxlength="60" autocomplete="off" placeholder="Name this view"><button class="btn" type="button" id="saveViewButton">Save this view</button><button class="btn btn-quiet" type="button" id="resetViewsButton">Reset</button></section>
  </main>
  <script type="module" src="/js/search-page.js"></script>
</body>
</html>
