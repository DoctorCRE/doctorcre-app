<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Search · DoctorCRE</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/business-workspace.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to search</a>
  <main id="main" class="shell">
    <div data-layout-slot="sidebar" class="hero"><div><h1>Search</h1></div></div>
    <section class="card glass" data-search="ask">
      <form id="searchForm" role="search"><div class="field"><label for="searchQuery">Name, email or domain</label><input id="searchQuery" type="search" maxlength="200" autocomplete="off" placeholder="Search people, companies and deals"></div><div class="row-wrap"><button class="btn btn-primary" type="submit">Search</button><span class="small" id="searchCount"></span></div></form>
    </section>
    <p class="sr-only" id="searchLive" aria-live="polite" role="status"></p>
    <div class="state-block" id="searchState" data-state="empty" hidden></div>
    <div id="searchResults" class="search-results" aria-busy="false"></div>
    <section class="card glass" data-search="scope" hidden aria-labelledby="searchScopeTitle"><div class="card-heading"><h2 id="searchScopeTitle">Scope</h2></div><div class="chip-bar"><span class="chip-list" id="searchChips"></span></div></section>
    <section class="card glass" data-search="views" hidden aria-labelledby="savedViewTitle"><div class="card-heading"><h2 id="savedViewTitle">Saved views</h2></div><div class="field"><label for="saveViewName">Name for this view</label><input id="saveViewName" type="text" maxlength="60" autocomplete="off"></div><div class="row-wrap"><button class="btn" type="button" id="saveViewButton">Save this view</button><button class="btn btn-quiet" type="button" id="resetViewsButton">Reset</button></div><div class="chip-bar"><span class="chip-list" id="savedViewList"></span></div><p class="caption" id="savedViewNote">Saved views stay in this browser.</p></section>
  </main>
  <script type="module" src="/js/search-page.js"></script>
</body>
</html>
