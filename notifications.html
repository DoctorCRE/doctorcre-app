<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="DoctorCRE updates">
  <title>Updates · DoctorCRE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/dealroom-192.png">
  <link rel="icon" href="/icons/dealroom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="preload" as="style" data-font-stylesheet href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/app-shell.css">
</head>
<body>
  <div id="appShell"></div><script type="module" src="/js/app-shell.js"></script>
  <a class="skip" href="#main">Skip to the notifications</a>
  <div data-layout-slot="status">



    <div class="global-controls pref-icons" role="group" aria-label="Presentation">
      <p id="prefsLive" class="sr-only" aria-live="polite"></p>
    </div>
  </div>

  <main id="main" class="shell">
    <section class="card glass hero-card" aria-labelledby="pageTitle">
      <div class="hero">
        <h1 id="pageTitle">Updates</h1>
        <span class="as-of" id="feedAsOf"></span>
      </div>
      <p class="headline" id="unreadLine"></p>
      <p class="quiet-banner" id="quietNowBanner" data-quiet="off" hidden></p>
    </section>

    <p class="sr-only" id="feedLive" aria-live="polite" role="status">Loading notifications…</p>

    <section class="card glass" data-section="feed" id="feedBlock" aria-labelledby="feedTitle">
      <div class="card-heading">
        <h2 id="feedTitle">Notifications</h2>
        <button class="btn" type="button" data-layout-refresh id="retryRead">Refresh</button>
      </div>
      <div class="state-block" id="feedState" data-state="loading"><h3 id="feedStateTitle">Loading notifications…</h3><p class="state-hint" id="feedStateHint"></p></div>
      <ul class="work-list" id="feedList"></ul>
    </section>

    <section class="card glass" data-section="quiet_hours" id="quietHoursBlock" aria-labelledby="quietHoursTitle">
      <div class="card-heading">
        <h2 id="quietHoursTitle">Your notification preferences</h2>
        <span class="as-of" id="prefAsOf"></span>
      </div>
      <div class="state-block" id="prefState" data-state="loading">
        <h3 id="prefStateTitle">Reading your preferences…</h3>
        <button class="btn" type="button" id="retryPreference" hidden>Retry</button>
      </div>
      <form class="pref-form" id="prefForm" novalidate hidden>
        <label class="switch-field">
          <input id="deviceOptIn" type="checkbox">
          <span>Send a device push when something is addressed to me</span>
        </label>
        <div class="pref-grid">
          <div class="field"><label for="quietStart">Quiet hours start</label><input id="quietStart" type="text" autocomplete="off" placeholder="10:00 PM"></div>
          <div class="field"><label for="quietEnd">Quiet hours end</label><input id="quietEnd" type="text" autocomplete="off" placeholder="7:00 AM"></div>
          <div class="field"><label for="quietTimezone">Timezone</label><input id="quietTimezone" type="text" list="timezoneNames" autocomplete="off" spellcheck="false" placeholder="America/Chicago"><datalist id="timezoneNames"></datalist></div>
        </div>
        <p class="caption pref-summary" id="prefSummary"></p>
        <div class="pref-act">
          <button class="btn btn-primary" type="submit" id="prefSave">Save preferences</button>
          <button class="btn" type="button" id="prefClear">Clear quiet hours</button>
        </div>
      </form>
      <p class="caption pref-message" id="prefMessage" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <section class="card glass" data-section="activity" id="activityBlock" aria-labelledby="activityTitle" hidden>
      <div class="card-heading">
        <h2 id="activityTitle">Who did what</h2>
        <span class="as-of" id="activityAsOf"></span>
      </div>
      <ul class="work-list" id="activityList"></ul>
      <div class="pref-act"><button class="btn" type="button" id="activityMore" hidden>Show more</button><p class="caption" id="activityMoreState" role="status" aria-live="polite"></p></div>
      <div class="state-block" id="activityState" data-state="unavailable" hidden><h3>Recent activity is unavailable</h3></div>
    </section>

    <div id="phonePush"></div>
  </main>

  <div id="receiptDock" class="receipt-dock" role="group" aria-label="Command feedback"></div>
  <footer class="shell"><p class="small">DoctorCRE · Updates</p></footer>
  <script type="module" src="/js/ui-phone-push.generated.js"></script>
  <script type="module" src="/js/notifications.js"></script>
</body>
</html>
